name: comment-guard CI

on:
  push:
    branches: [main]
    paths: ["labs/day07_comment_guard/**", ".github/workflows/comment-guard-ci.yml"]
  pull_request:
    paths: ["labs/day07_comment_guard/**", ".github/workflows/comment-guard-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: labs/day07_comment_guard

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: labs/day07_comment_guard

      - name: Install from lockfile
        run: uv sync --locked

      - name: Lint (ruff, incl. bandit S rules)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tests (mocked Graph API + full dbt build)
        run: uv run pytest

      - name: Audit locked dependencies for known vulnerabilities
        run: |
          uv export --locked --format requirements-txt --no-emit-project > "$RUNNER_TEMP/req.txt"
          uvx pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
