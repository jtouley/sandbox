[project]
name = "halloween-candy-dbt"
version = "0.1.0"
description = "dbt + DuckDB/MotherDuck project for analyzing a Halloween candy haul."
# dbt-core doesn't support Python 3.14 yet, so this lab has its own env (the root sandbox is 3.14).
requires-python = ">=3.11,<3.14"
dependencies = [
  "dbt-core>=1.9,<2",
  "dbt-duckdb>=1.9",
  # MotherDuck lags DuckDB releases; 2.0 is not supported yet (latest supported: 1.5.x).
  "duckdb>=1.5,<1.6",
]
