version: 2

models:
  - name: brz_api_responses
    description: >
      Every Graph API response landed by `cg capture`, one row per JSONL line, with the
      verbatim (token-redacted) body and its SHA-256. Append-only source of record.
    columns:
      - name: run_id
        data_tests: [not_null]
      - name: stream
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [me, media, comments, replies]
      - name: body_hash_ok
        description: "sha256(body) matches the hash written at capture time."
        data_tests:
          - accepted_values:
              arguments:
                values: [true]
                quote: false
      - name: landing_file
        data_tests: [not_null]

  - name: brz_comment_lines
    description: >
      Readable per-post comment files from `cg capture`: one row per comment or reply, each
      pointing back (source_file / source_seq / source_body_sha256) to the raw response it
      was taken from.
    columns:
      - name: comment_id
        data_tests: [not_null]
      - name: post_id
        data_tests: [not_null]
      - name: source_body_sha256
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_api_responses')
                field: body_sha256
