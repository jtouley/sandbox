[project]
name = "comment-guard"
version = "0.1.0"
description = "Capture a creator's own Instagram comments as evidence-grade raw data, then model them bronze -> silver -> gold with DuckDB + dbt."
readme = "README.md"
license = "MIT"
# dbt-core doesn't support Python 3.14 yet, so this lab has its own env (the root sandbox is 3.14).
requires-python = ">=3.11,<3.14"
dependencies = [
  "dbt-core>=1.10,<2",
  "dbt-duckdb>=1.9",
  "duckdb>=1.4",
  "httpx>=0.27,<1",
  "keyring>=25",
]

[project.scripts]
cg = "comment_guard.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comment_guard"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "B", "PL", "W", "S"]
# S101: asserts are fine in tests. PLR2004: magic numbers. PLR0913: CLI-ish signatures.
lint.ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
